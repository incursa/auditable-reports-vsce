<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Auditable report compilation pipeline</title>
  <desc id="desc">Report Markdown flows to artifact JSON, then to a live preview and a Paged.js PDF.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8ff"/>
      <stop offset="1" stop-color="#e8ecff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7b8798"/>
    </marker>
  </defs>
  <rect width="1120" height="300" rx="22" fill="#f1f4f8"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(38 46)">
      <rect width="220" height="176" rx="14" fill="url(#paper)" stroke="#4459c6" stroke-width="3"/>
      <path d="M58 46H162M58 72H146M58 98H162" stroke="#4459c6" stroke-width="8" stroke-linecap="round"/>
      <text x="110" y="146" fill="#263248" font-size="20" font-weight="700">Report Markdown</text>
    </g>
    <path d="M274 134H334" stroke="#7b8798" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(352 46)">
      <rect width="220" height="176" rx="14" fill="#263248"/>
      <path d="M63 50L42 88L63 126M157 50L178 88L157 126" fill="none" stroke="#8fe0d8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="146" fill="#fff" font-size="20" font-weight="700">artifact.json</text>
    </g>
    <path d="M588 134H648" stroke="#7b8798" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(666 46)">
      <rect width="180" height="176" rx="14" fill="#fff" stroke="#25a59a" stroke-width="3"/>
      <rect x="28" y="35" width="124" height="18" rx="5" fill="#4459c6"/>
      <rect x="28" y="69" width="58" height="52" rx="6" fill="#dfe4ff"/>
      <rect x="94" y="69" width="58" height="52" rx="6" fill="#d8f0ed"/>
      <text x="90" y="148" fill="#263248" font-size="19" font-weight="700">Live preview</text>
    </g>
    <path d="M862 134H918" stroke="#7b8798" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(936 46)">
      <rect width="146" height="176" rx="14" fill="#fff" stroke="#e4a448" stroke-width="3"/>
      <path d="M35 45H111M35 69H98M35 93H111M35 117H86" stroke="#7b8798" stroke-width="6" stroke-linecap="round"/>
      <text x="73" y="148" fill="#263248" font-size="19" font-weight="700">Paged PDF</text>
    </g>
  </g>
  <text x="560" y="270" text-anchor="middle" fill="#667085" font-family="Segoe UI,Arial,sans-serif" font-size="17">One canonical compiler · two disposable renderings · durable evidence beside the source</text>
</svg>
